[project]
name = "cfps"
version = "0.0.0"
description = "Conference CFP watchlist: public CFP feeds merged into one note per conference."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pycountry>=24.6.1",
]

[project.optional-dependencies]
# Legacy alias; pycountry is now installed by default.
flags = ["pycountry"]

[tool.uv]
# No build backend — this is a scripts folder, not an installable package.
package = false
